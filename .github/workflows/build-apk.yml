name: Build Android Debug APK (via Expo Prebuild)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        default: 'debug'
        required: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android Command Line Tools
        run: |
          # Set up Android SDK environment variables
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          mkdir -p $HOME/android-sdk
          # Download command line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Android SDK and accept licenses
        run: |
          # Use echo to feed 'y' for all license prompts
          echo -ne "y\ny\ny\ny\ny\ny\ny\ny\n" | sdkmanager --licenses > /dev/null 2>&1

          # Install essential Android SDK components
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "✅ Android SDK installed successfully"

      - name: Install dependencies
        run: |
          # First, install @nozbe/with-observables with force to override React version conflict
          npm install @nozbe/with-observables@2.0.3 --legacy-peer-deps --no-audit --no-fund || echo "Could not install specific version, continuing anyway"
          # Then install all other dependencies
          npm install --legacy-peer-deps --no-audit --no-fund
          # Skip expo install --fix as it causes version conflicts
          echo "✅ Dependencies installed successfully"

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          CI: true

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: muhasebe-cepte-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Show build summary
        run: |
          echo "✅ Android Debug APK build completed successfully!"
          echo "📦 Artifact: muhasebe-cepte-debug"
          echo "📁 APK path: android/app/build/outputs/apk/debug/app-debug.apk"
